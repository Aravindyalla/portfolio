<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="124" height="124" rx="30" stroke="url(#cyber-grad)" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Neural hexagon / chip nodes -->
  <polygon points="64,28 96,46 96,82 64,100 32,82 32,46" stroke="url(#cyber-grad)" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  
  <!-- Central Core -->
  <circle cx="64" cy="64" r="14" fill="url(#cyber-grad)" />
  
  <!-- Radiating Node Lines -->
  <line x1="64" y1="28" x2="64" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="78" x2="64" y2="100" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="52" y2="57" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="46" x2="76" y2="57" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="82" x2="52" y2="71" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="82" x2="76" y2="71" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Outer Node Dots -->
  <circle cx="64" cy="28" r="4.5" fill="#38bdf8" />
  <circle cx="96" cy="46" r="4.5" fill="#38bdf8" />
  <circle cx="96" cy="82" r="4.5" fill="#a855f7" />
  <circle cx="64" cy="100" r="4.5" fill="#a855f7" />
  <circle cx="32" cy="82" r="4.5" fill="#06b6d4" />
  <circle cx="32" cy="46" r="4.5" fill="#06b6d4" />
</svg>
